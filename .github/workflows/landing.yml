name: Landing CI/CD
on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [prod]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pap-landing-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check static site and detect forbidden files
        run: bash scripts/validate.sh
      - name: Docker build
        run: docker build --build-arg VCS_REF=${GITHUB_SHA} -t pap-landing-ci .
      - name: Runtime smoke test
        run: |
          docker run -d --name pap-landing-ci --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=16777216,uid=101,gid=101 \
            -p 127.0.0.1:13102:8080 pap-landing-ci
          for n in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:13102/healthz && curl -fsS http://127.0.0.1:13102/ >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs pap-landing-ci
          exit 1
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod' && github.repository == 'papsaudeapp/pap-saude-landing'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable SHA image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VCS_REF=${{ github.sha }}
          tags: ghcr.io/papsaudeapp/pap-saude-landing:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/papsaudeapp/pap-saude-landing
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod' && vars.LANDING_AUTODEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    environment: landing-production
    steps:
      - name: Configure pinned SSH known_hosts and deploy key
        env:
          LANDING_SSH_KEY: ${{ secrets.LANDING_SSH_KEY }}
          LANDING_KNOWN_HOSTS: ${{ secrets.LANDING_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          test -n "$LANDING_SSH_KEY"
          test -n "$LANDING_KNOWN_HOSTS"
          printf '%s\n' "$LANDING_SSH_KEY" > ~/.ssh/landing_key
          printf '%s\n' "$LANDING_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy only the landing image
        env:
          VPS_HOST: ${{ secrets.LANDING_VPS_HOST }}
          VPS_PORT: ${{ secrets.LANDING_VPS_PORT }}
          VPS_USER: ${{ secrets.LANDING_VPS_USER }}
          SHA: ${{ github.sha }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          ssh -p "$VPS_PORT" -i ~/.ssh/landing_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/sbin/pap-landing-deploy '$SHA' '$DIGEST'"
