name: pap-landing
services:
  web:
    container_name: pap-landing-web
    image: ${LANDING_IMAGE:?Set LANDING_IMAGE to approved immutable digest}
    ports:
      - "127.0.0.1:3102:8080"
    restart: unless-stopped
    read_only: true
    user: "101:101"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - "/tmp:rw,nosuid,nodev,size=16777216,uid=101,gid=101"
    mem_limit: 128m
    cpus: "0.50"
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
